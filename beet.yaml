id: project_name_template
version: 0.1.0

description: "project_name_template datapack project using weld deps"

output: build

pipeline:
  - simple_item_plugin
  - project_name_template

require:
  - bolt
  - weld_deps
  - weld_deps.contrib.mecha_auto_include.require

ignore:
  - stable_cache.json

data_pack:
  name: "{{ project_id }}_{{ project_version }}_dp_bundled"
  load: src

resource_pack:
  name: "{{ project_id }}_{{ project_version }}_rp_bundled"
  load: src

meta:
  mc_supports:
    - "26.1.2"
  minecraft_version: "26.1.2"
  modrinth_id: project_name_template

  simple_item_plugin:
    custom_model_data: 1430000
    generate_guide: true
    tick_function: project_name_template:impl/tick
    load_function: project_name_template:impl/load

  model_merging:
    predicate_order:
      - custom_model_data
      - pulling
      - pull
      - charged
      - firework

  mecha:
    multiline: true
    match:
      - "project_name_template:**"

  model_resolver:
    render_size: 256
    load_vanilla: true
    save_namespace: grappling_hook
    minecraft_version: "26.1.2"

  smithed:
    versioning:
      scheduled_paths:
        - impl/tick

      lantern_load:
        step: load
        tag_path: load
        function_path: impl/test_load

      refactor:
        match: "{{ project_id }}:*"
        find: "{{ project_id }}:impl/"
        replace: "{{ project_id }}:v{{ project_version }}/"

      api:
        match: "{{ project_id }}:v{{ project_version }}"
        implementation_prefix: "{{ project_id }}:v{{ project_version }}/"
        version_check_path: "v{{ project_version }}/calls"
        tag_path: calls

  weld_deps:
    merge_with_weld: false
    deps:
      - id: itemio
        version_: "1.2.6"
        source: smithed
